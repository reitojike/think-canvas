name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: lint・test・build・公開境界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Room schema の差分確認
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: 単体テスト
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: デバッグビルド
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: PR のデバッグ APK を保存
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: think-canvas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: 公開情報境界
        shell: pwsh
        run: ./scripts/check-public-boundary.ps1

  emulator:
    name: Android 17 エミュレーター
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ジェスチャーと保存の実機相当テスト
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          disk-size: 8192M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu software -feature -Vulkan -camera-back none -camera-front none
          script: |
            for attempt in $(seq 1 60); do value="$(adb shell settings get system font_scale 2>&1 | tr -d '\r' | xargs)"; if printf '%s\n' "$value" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then echo "Android settings provider is ready: font_scale=$value"; break; fi; if [ "$attempt" -eq 60 ]; then echo "Android settings provider did not become ready within 120 seconds; last_output=$value"; exit 1; fi; sleep 2; done
            rm -rf app/build/outputs/androidTest-results/connected/ app/build/reports/androidTests/connected/
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Instrumentation result integrity gate
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          results = Path("app/build/outputs/androidTest-results/connected")
          xml_files = sorted(results.rglob("TEST-*.xml")) if results.exists() else []
          testcases = failures = errors = 0

          try:
              for path in xml_files:
                  root = ET.parse(path).getroot()
                  for element in root.iter():
                      tag = element.tag.rsplit("}", 1)[-1]
                      if tag == "testcase":
                          testcases += 1
                      elif tag == "failure":
                          failures += 1
                      elif tag == "error":
                          errors += 1
          except (ET.ParseError, OSError) as exc:
              print(f"Invalid instrumentation result XML: {exc}")
              sys.exit(1)

          print(f"result_files={len(xml_files)} testcases={testcases} failures={failures} errors={errors}")
          for apk in (
              Path("app/build/outputs/apk/debug/app-debug.apk"),
              Path("app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"),
          ):
              if apk.is_file():
                  print(f"{apk} bytes={apk.stat().st_size}")

          if not xml_files:
              print("No fresh TEST-*.xml instrumentation results were produced.")
              sys.exit(1)
          if testcases == 0:
              print("Instrumentation results contain no testcases.")
              sys.exit(1)
          if failures > 0 or errors > 0:
              print("Instrumentation results contain failures or errors.")
              sys.exit(1)
          PY
      - name: Android 17 instrumentation results を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-instrumentation-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: error
          retention-days: 7
