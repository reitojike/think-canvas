name: Issue 78 EXACTLY_ONE_OBSERVATION

on:
  pull_request:
    branches: [codex/issue-78-postmerge-diagnostic-base]
    types: [opened]

permissions:
  contents: read

jobs:
  managed-device:
    name: DIAGNOSTIC_ONLY Pixel9 API37 single method
    if: github.run_attempt == 1 && github.event.pull_request.head.ref == 'codex/issue-78-postmerge-diagnostic-observation'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: GMD 実行前の環境を記録
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          exec > >(tee diagnostic-output/environment-before.txt) 2>&1
          printf 'actual_checkout_sha=%s\nactual_checkout_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          printf 'diagnostic_base_sha=%s\ndiagnostic_head_sha=%s\n' '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'
          printf 'census_phase=before_gmd\n'
          printf 'run_id=%s\nrun_attempt=%s\nworkflow_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"

          cat /etc/os-release
          printf 'ImageOS=%s\nImageVersion=%s\n' \
            "${ImageOS:-UNSET}" "${ImageVersion:-UNSET}"
          uname -m
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:?ANDROID_HOME is required}"

          sdkmanager_bin="$(command -v sdkmanager)"
          avdmanager_bin="${sdkmanager_bin%/*}/avdmanager"
          printf 'sdkmanager=%s\navdmanager=%s\n' \
            "$sdkmanager_bin" "$avdmanager_bin"
          "$sdkmanager_bin" --version
          awk '/^Pkg\.(Revision|Path|Desc)=/' \
            "${sdkmanager_bin%/*}/../source.properties"
          "$avdmanager_bin" list device --compact

          printf 'GMD definition from current checkout:\n'
          sed -n '/create("pixel9Api37") {/,/^[[:space:]]*}/p' \
            app/build.gradle.kts
          printf 'Expected baseline: pixel_9 / API 37 / google_apis / x86_64\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: EXACTLY_ONE_OBSERVATION 対象methodを1回だけ実行
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:pixel9Api37DebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.thinkcanvas.canvas.EdgeAutoPanTest#multiSelectionTranslatesTextShapeAndFreeArrowTogether" -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon 2>&1 | tee diagnostic-output/focused-gmd.txt
      - name: GMD 実行後の環境を記録
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          exec > >(tee diagnostic-output/environment-after.txt) 2>&1
          printf 'census_phase=after_gmd\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: selectorをfail-closedで確認
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          files = list(pathlib.Path("app/build/outputs/androidTest-results/managedDevice/debug/pixel9Api37").glob("TEST-*.xml"))
          identities = []
          for path in files:
              identities += [c.get("classname") + "#" + c.get("name") for c in ET.parse(path).getroot().iter("testcase")]
          expected = ["com.thinkcanvas.canvas.EdgeAutoPanTest#multiSelectionTranslatesTextShapeAndFreeArrowTogether"]
          valid = identities == expected
          result = {"valid": valid, "identities": identities, "xml_files": [str(p) for p in files], "classification": "SELECTOR_GATE_PASSED" if valid else "ISSUE_78_DIAGNOSTIC_SELECTOR_GATE_FAILED"}
          pathlib.Path("diagnostic-output").mkdir(exist_ok=True)
          pathlib.Path("diagnostic-output/selector-gate.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          sys.exit(0 if valid else 1)
          PY
      - name: Android 17 GMD 診断結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-78-exactly-one-observation
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
            app/build/intermediates/managed_device_android_test_additional_output/
            diagnostic-output/
          if-no-files-found: warn
          retention-days: 7
