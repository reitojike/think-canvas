name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: lint・test・build・公開境界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Room schema の差分確認
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: 単体テスト
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: デバッグビルド
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: 公開情報境界
        shell: pwsh
        run: ./scripts/check-public-boundary.ps1
