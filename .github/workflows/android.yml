name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: lint・test・build・公開境界
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Room schema の差分確認
        run: |
          ./gradlew :app:kspDebugKotlin --no-daemon
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: 単体テスト
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: デバッグビルド
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: PR のデバッグ APK を保存
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: think-canvas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: 公開情報境界
        shell: pwsh
        run: ./scripts/check-public-boundary.ps1

  managed-device:
    name: Android 17 Gradle Managed Device
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: GMD 実行前の環境を記録
        shell: bash
        run: |
          set -euo pipefail
          printf 'census_phase=before_gmd\n'
          printf 'run_id=%s\nrun_attempt=%s\nworkflow_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"

          cat /etc/os-release
          printf 'ImageOS=%s\nImageVersion=%s\n' \
            "${ImageOS:-UNSET}" "${ImageVersion:-UNSET}"
          uname -m
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:?ANDROID_HOME is required}"

          sdkmanager_bin="$(command -v sdkmanager)"
          avdmanager_bin="${sdkmanager_bin%/*}/avdmanager"
          printf 'sdkmanager=%s\navdmanager=%s\n' \
            "$sdkmanager_bin" "$avdmanager_bin"
          "$sdkmanager_bin" --version
          awk '/^Pkg\.(Revision|Path|Desc)=/' \
            "${sdkmanager_bin%/*}/../source.properties"
          "$avdmanager_bin" list device --compact

          printf 'GMD definition from current checkout:\n'
          sed -n '/create("pixel7Api37") {/,/^[[:space:]]*}/p' \
            app/build.gradle.kts
          printf 'Expected baseline: pixel_7 / API 37 / google_apis / x86_64\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: ジェスチャーと保存の実機相当テスト
        run: ./gradlew :app:pixel7Api37DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon
      - name: GMD 実行後の環境を記録
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'census_phase=after_gmd\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: Android 17 GMD 診断結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-gmd-test-results
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7
