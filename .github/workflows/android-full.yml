name: Android manual full GMD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full:
    name: Android 17 unfiltered full GMD (262)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: exact identity receipt を確認
        run: python3 scripts/check-android-test-suites.py validate --suite full --receipt-out "$RUNNER_TEMP/android-full-receipt.json"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: filterなし full 262件を実行
        id: gmd
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/build/outputs/androidTest-results/managedDevice
          date -u +%s > "$RUNNER_TEMP/android-full-started-at"
          ./gradlew :app:pixel9Api37DebugAndroidTest --rerun \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon
      - name: fresh XML の identity と counters を確認
        if: ${{ !cancelled() && steps.gmd.outcome != 'skipped' }}
        run: |
          python3 scripts/check-android-test-suites.py verify-suite --suite full \
            --started-at "$RUNNER_TEMP/android-full-started-at" \
            --verification-out "$RUNNER_TEMP/android-full-verification.json"
      - name: GMD の診断と検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-gmd-full-results
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            ${{ runner.temp }}/android-full-receipt.json
            ${{ runner.temp }}/android-full-verification.json
          if-no-files-found: error
          retention-days: 21
