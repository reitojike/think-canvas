name: Android Ubuntu 26.04 canary

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-character lowercase commit SHA to test (no branch names)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  managed-device:
    name: Ubuntu 26.04 Pixel 7 GMD canary
    runs-on: ubuntu-26.04
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: 要求された source と run を記録・検証
        shell: bash
        run: |
          set -euo pipefail
          printf 'requested_target_sha=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$TARGET_SHA" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'target_sha must be a full 40-character lowercase commit SHA.\n' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
      - name: checkout SHA を記録・照合
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'actual_checkout_sha=%s\n' "$actual_sha"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            printf 'Checkout SHA does not match requested target_sha.\n' >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: GMD 実行前の環境を記録
        shell: bash
        run: |
          set -euo pipefail
          printf 'census_phase=before_gmd\n'
          printf 'run_id=%s\nrun_attempt=%s\nworkflow_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
          printf 'requested_target_sha=%s\nactual_checkout_sha=%s\n' \
            "$TARGET_SHA" "$(git rev-parse HEAD)"

          cat /etc/os-release
          printf 'ImageOS=%s\nImageVersion=%s\n' \
            "${ImageOS:-UNSET}" "${ImageVersion:-UNSET}"
          uname -m
          printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME:?ANDROID_HOME is required}"

          sdkmanager_bin="$(command -v sdkmanager)"
          avdmanager_bin="${sdkmanager_bin%/*}/avdmanager"
          printf 'sdkmanager=%s\navdmanager=%s\n' \
            "$sdkmanager_bin" "$avdmanager_bin"
          "$sdkmanager_bin" --version
          awk '/^Pkg\.(Revision|Path|Desc)=/' \
            "${sdkmanager_bin%/*}/../source.properties"
          "$avdmanager_bin" list device --compact

          printf 'GMD definition from current checkout:\n'
          sed -n '/create("pixel7Api37") {/,/^[[:space:]]*}/p' \
            app/build.gradle.kts
          printf 'Expected baseline: pixel_7 / API 37 / google_apis / x86_64\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: ジェスチャーと保存の実機相当テスト
        run: ./gradlew :app:pixel7Api37DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon
      - name: GMD 実行後の環境を記録
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'census_phase=after_gmd\n'

          for package in \
            platform-tools \
            emulator \
            platforms/android-37.0 \
            system-images/android-37.0/google_apis/x86_64
          do
            properties="${ANDROID_HOME:?}/$package/source.properties"
            printf '\nSDK package: %s\n' "$package"
            if [[ -f "$properties" ]]; then
              awk '/^(Pkg\.(Revision|Path|Desc)|AndroidVersion\.(ApiLevel|ExtensionLevel|IsBaseSdk)|SystemImage\.(Abi|TagId|TagDisplay))=/' \
                "$properties"
            else
              printf 'NOT_INSTALLED_AT_THIS_PHASE\n'
            fi
          done

      - name: Android 17 GMD 診断結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-26-pixel7-gmd-test-results
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7
