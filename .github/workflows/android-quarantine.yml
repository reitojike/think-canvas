name: Android IME quarantine GMD

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quarantine:
    name: Android 17 IME quarantine GMD (38)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: exact identity receipt を確認
        run: python3 scripts/check-android-test-suites.py validate --suite quarantine --receipt-out "$RUNNER_TEMP/android-quarantine-receipt.json"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: エミュレーターの KVM を有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: FlakyTest 38件を実行
        id: gmd
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/build/outputs/androidTest-results/managedDevice
          date -u +%s > "$RUNNER_TEMP/android-quarantine-started-at"
          ./gradlew :app:pixel9Api37DebugAndroidTest --rerun \
            -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.FlakyTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-daemon
      - name: fresh XML の identity と counters を確認
        if: ${{ !cancelled() && steps.gmd.outcome != 'skipped' }}
        run: |
          python3 scripts/check-android-test-suites.py verify-suite --suite quarantine \
            --started-at "$RUNNER_TEMP/android-quarantine-started-at" \
            --verification-out "$RUNNER_TEMP/android-quarantine-verification.json"
      - name: GMD の診断と検証結果を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-17-gmd-quarantine-results
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            ${{ runner.temp }}/android-quarantine-receipt.json
            ${{ runner.temp }}/android-quarantine-verification.json
          if-no-files-found: error
          retention-days: 21
      - name: failure を #106 に同一 run で一度だけ通知
        if: failure() && !cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = `<!-- ime-quarantine-run:${context.runId} -->`;
            const issue = {...context.repo, issue_number: 106};
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            if (comments.some(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) {
              core.info('この run の failure は通知済み');
              return;
            }
            const receipt = path.join(process.env.RUNNER_TEMP, 'android-quarantine-verification.json');
            let result = {};
            if (fs.existsSync(receipt)) {
              try { result = JSON.parse(fs.readFileSync(receipt, 'utf8')); }
              catch { core.warning('verification receipt が読めないため infra-invalid として通知'); }
            }
            const counters = ['tests', 'failures', 'errors', 'skipped']
              .map(key => `${key}=${result[key] ?? 'UNKNOWN'}`).join(', ');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [marker, 'IME temporary quarantine の strict failure を記録します。',
              `run: ${url} / attempt: ${process.env.GITHUB_RUN_ATTEMPT} / event: ${context.eventName}`,
              `head: ${context.sha}`, `expected=38 / ${counters}`,
              `sample: ${result.sample_status ?? 'infra-invalid'} / ${result.reason ?? 'instrumentation開始前 failure または XML missing/incomplete'}`,
              'test failure が XML に記録された complete fresh exact38 は valid red です。SUCCESS へ変換しません。',
              'owner: #106 / review date: 2026-10-23。valid scheduled run >=14 を確認し continue / narrow / remove quarantine を明示判断します。自動解除しません。'
            ].join('\n\n');
            await github.rest.issues.createComment({...issue, body});
